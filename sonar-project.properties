# SonarCloud configuration.
#
# Kept as a file rather than as arguments on the scan step, so the analysis says
# the same thing whichever machine runs it and so that what gets analysed is
# visible to anyone reading the repository rather than buried in a workflow.
#
# The token is never in here. It comes from the SONAR_TOKEN repository secret.

# The project key is the GitHub owner and the repository name joined by an
# underscore, which is what SonarCloud assigns when it imports a repository.
# Both were `fabeat` before the repository moved to this organisation, and the
# project was re-imported rather than renamed — a bound organisation cannot be
# re-pointed, so the only way to change it is to create the project again.
#
# These two have to match, or the scan is refused with "not authorized or project
# not found" — which reads like a token problem and is not one. After a re-import
# they are also a thing that must exist before this is pushed: the project is
# created from the repository, not from this file.
sonar.projectKey=markdown-office_markdown-word
sonar.organization=markdown-office

# The library is what is analysed; the tests are read so that coverage and
# duplication are judged against them.
#
# `bin` is here because `bin/mdword` is the command Composer installs for every
# user of the package, and it is not in `.gitattributes`' export-ignore list. It
# was outside this pair of lists once, so the one script that ships was the one
# script the scan never saw.
#
# `examples/build.php` is not analysed, and `examples/out` below is the directory
# it writes. The two root scripts `smoke.php` and `stress.php` are not analysed
# either: they exist to run where the suite cannot — Pest 5 needs PHP 8.4 and the
# library supports 8.2 — so they must stay outside it.
sonar.sources=src,bin
sonar.tests=tests,tools
sonar.sourceEncoding=UTF-8

# What "new" means, and it is not the same thing as "recent". Left unset, SonarCloud
# counts a line as new when it changed since the *previous version*, which this project
# does not cut on every merge — so a pull request would be measured against a baseline
# that moves when a release happens rather than when the code does, and the gate would
# pass or fail for reasons nobody reading the diff could see.
#
# Naming `main` measures the gate on what the pull request actually changes, which is
# what the analysis job above says it does when it asks for the full history. Without
# it that history is fetched for nothing.
sonar.newCode.referenceBranch=main

# Everything a build produces rather than anything authored.
sonar.exclusions=\
  build/**,\
  vendor/**,\
  examples/out/**,\
  tmp/**,\
  .phpunit.cache/**

# The version the code has to *run* on, which is not the version CI happens to
# run on. It is what the analysis is judged against, so setting it higher would
# let syntax in that the minimum-version job then rejects.
sonar.php.version=8.2

# Both reports are written by the analysis job, which runs the suite once for
# coverage and for the test results together.
sonar.php.coverage.reportPaths=build/coverage/clover.xml
sonar.junit.reportPaths=build/coverage/junit.xml

# Coverage is a statement about the library, so it is measured over the library.
#
# The tests are still analysed — they are where two of the findings this project
# has had were, and it would be odd to stop looking there — but they are kept out
# of the coverage figure. A pull request that adds tests would otherwise dilute
# its own coverage with lines that no coverage report describes, which is a gate
# that punishes writing tests.
sonar.coverage.exclusions=examples/**,tests/**,tools/**
