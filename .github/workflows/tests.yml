name: tests

on:
  push:
    branches: [main]
    # A tag as well as a branch, so cutting a release runs the same suite `main`
    # does. Without this the tag is the one ref in the repository that is never
    # tested, and a release could be published from a commit whose 3,089 tests are
    # red — the release workflow builds the archive and does not test the library.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # The jobs below install what the lock file pins, so nothing upstream can break
  # a build without anyone noticing. This is the one that resolves afresh, to find
  # out when it does.
  schedule:
    - cron: '17 6 * * 1'

# One push does not need five runs; the last is enough.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks that do not depend on a PHP version. Cheap, and they fail fastest.
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      # A manifest that does not validate is not worth running anything else
      # against, and the lock file has to match it or the install below would
      # quietly resolve something else.
      - name: Validate the manifest and the lock file
        run: composer validate --strict

      - name: Install
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Known security advisories
        run: composer audit --no-interaction

      # Every code block in the README is executed, so the documentation cannot
      # quietly stop describing what the code does. Run on its own here as well as
      # with the suite below, because it is the one thing that fails when the page
      # and the library disagree, and it should say so before the whole suite runs.
      - name: The examples in the README work
        run: vendor/bin/pest --testsuite=readme

  # Static analysis, on every pull request including a fork's.
  #
  # SonarCloud below is the richer analysis, and it only runs on `main` and on
  # pull requests from this repository. A pull request from a fork gets nothing,
  # which is exactly where a second pair of eyes matters most. This is that
  # second pair: it runs everywhere, and it is a different tool, so a rule
  # SonarCloud does not carry can still fail a change here.
  #
  # It is deliberately not a development dependency. PHPStan is pinned to a
  # version and a checksum below rather than resolved through the lock file,
  # because adding it to `require-dev` means rewriting `composer.lock`, and a
  # lock file that disagrees with `composer.json` fails `composer validate
  # --strict` and breaks `composer install`. Moving it in is a one-line change
  # to `require-dev` and a `composer update phpstan/phpstan`; the job below
  # would then be one `composer analyse` away.
  static:
    name: static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install
        run: composer install --prefer-dist --no-interaction --no-progress

      # The version and the checksum of one file, rather than a range and a
      # download. A range would be a different analyser next month and a green
      # run would mean nothing; the checksum says the bytes are the bytes this
      # level was chosen against.
      - name: Fetch PHPStan
        run: |
          mkdir -p tmp
          curl --fail --silent --show-error --location --output tmp/phpstan.phar \
            https://github.com/phpstan/phpstan/releases/download/2.2.16/phpstan.phar
          echo '1a2fb5460c142502d3cd06272529c18b19fda004ada974bd2581cb9fd6c0a53b  tmp/phpstan.phar' \
            | sha256sum --check --strict

      # Level 1, because that is the highest level this code passes without a
      # single `ignoreErrors`, a baseline or a suppression comment. It is not a
      # weak gate: it catches unknown classes, unknown functions, wrong argument
      # counts and types, and methods called on things that do not have them.
      #
      # Level 2 finds more, and they are worth having. The ones that were in
      # `src/` have since been fixed — three `@throws` tags named a
      # `MarkdownWord\RuntimeException` that does not exist, and correcting them
      # is what left `src/Writer/DocxWriter.php` documenting the
      # `\RuntimeException` it really does throw. The rest are in the tests,
      # where Pest's dynamic `test()`/`expect()` leave PHPStan nothing to infer
      # from without the plugin.
      #
      # The level is deliberately not justified by a count of findings: a number
      # goes stale the moment one is fixed, which is how the three `@throws` tags
      # above kept being cited long after they were corrected. Fixing the
      # library's real findings means editing `src/`, so the level moves when
      # they are fixed rather than the findings being hidden until then. Nothing
      # here is suppressed to get a green run.
      # `examples/build.php` is here for the same reason it is in `sonar.sources`:
      # it writes OOXML by hand, and a library defect was found by looking at what
      # it produced rather than by anything that could see it here.
      - name: Analyse
        run: |
          php tmp/phpstan.phar analyse \
            --level=1 \
            --autoload-file=vendor/autoload.php \
            --no-progress \
            src tools tests examples/build.php

  # The library on the oldest PHP it claims to support.
  #
  # Pest 5 needs PHP 8.4, so the test suite cannot run here. What can — and must —
  # is proof that the library itself works on this version: that it parses,
  # writes and reads back. A version-specific syntax error or a broken
  # autoloader is exactly what this catches.
  minimum:
    name: php 8.2 (minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      # `--no-dev` so the test framework is not installed — it needs PHP 8.4, and
      # the whole point here is what works on 8.2. The lock file is why that is
      # enough: the development requirements are read from it rather than
      # resolved, and `--no-dev` skips them. Without a lock file this would have
      # to be a runtime-only manifest, because `composer update --no-dev` still
      # *resolves* the development requirements even when it does not install them.
      - name: Install the runtime dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev

      # Names the version and every requirement, so a platform failure says which
      # package wanted what rather than leaving it to be inferred.
      - name: The platform is what we asked for
        run: |
          php -v
          composer check-platform-reqs --no-dev

      - name: The library works on this version
        run: php smoke.php

      - name: Malformed input across every configuration
        run: php stress.php

  # The full suite. Pest 5 needs PHP 8.4, so the floor here is 8.4 rather than
  # the library's own 8.2 — the two together cover the whole range.
  test:
    name: php ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          # pcov rather than xdebug: it is roughly an order of magnitude faster
          # and this suite writes and reads a few thousand documents.
          coverage: pcov
          tools: composer:v2

      - name: Install
        run: composer install --prefer-dist --no-interaction --no-progress

      # The SVG tests skip themselves on a build that cannot rasterise, which is right
      # but quiet: a runner that lost its SVG delegate would skip a few dozen tests and
      # the run would still be green. Asserted here rather than left to be noticed in
      # the skip count, because a suite that stopped testing the rasteriser is worse
      # than one that failed.
      #
      # `librsvg2-bin` is what ImageMagick uses as its SVG delegate. Without it the
      # runner falls back to ImageMagick's own renderer, which registers the format and
      # then drops the text out of every picture — so the tests below were checking a
      # rasteriser that was quietly producing half a picture.
      - name: Install an SVG delegate
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes librsvg2-bin fonts-dejavu-core

      - name: What the rasteriser here can do
        # Not a gate. It reports, because the SVG tests skip themselves on a host that
        # cannot rasterise, and a skip that nobody reads is how a suite stops testing the
        # thing it is for. This runner's ImageMagick has no librsvg coder — installing
        # librsvg2-bin does not give it one — so it draws the shapes and drops the text,
        # and the vector tests skip here.
        #
        # Before `SvgRasteriser::available()` learned to draw a letter rather than ask
        # ImageMagick whether the format was registered, this host answered yes and the
        # suite passed over a raster with every word missing from it.
        run: |
          echo "rsvg-convert: $(command -v rsvg-convert || echo MISSING)"
          php -r '
            printf("imagick extension: %s\n", phpversion("imagick") ?: "not loaded");
            $svg = "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"40\" height=\"20\"><text x=\"2\" y=\"15\" font-size=\"14\" fill=\"#000\">W</text></svg>";
            try {
              $i = new Imagick();
              $i->setBackgroundColor(new ImagickPixel("transparent"));
              $i->readImageBlob($svg);
              $ink = 0;
              foreach ($i->getImageHistogram() as $c) { if ($c->getColorValue(Imagick::COLOR_ALPHA) > 0.0) { $ink++; } }
              printf("a letter renders: %s (%d inked colours)\n", $ink > 0 ? "yes" : "NO — the SVG tests will skip", $ink);
            } catch (Throwable $e) {
              printf("a letter renders: NO — threw %s\n", $e->getMessage());
            }
          '

      - name: Test
        run: vendor/bin/pest

      # A coverage report on its own says little; this fails if the reported
      # figure is a placeholder, or if the code stops being covered at all.
      # 91 rather than 80, which is where it was: the suite sits a little over 93%,
      # so 80 let a thirteen-point regression through without anybody noticing.
      # Two points is thin but real, and it is the gap between a gate and a
      # report that only moves when the library changes shape. The exact figure
      # is not written down here on purpose — it moves with the coverage driver
      # and the PHP version, and a stale number in a comment is the same mistake
      # as a stale count of static-analysis findings.
      #
      # The JUnit report goes in the same run because the analysis job needs both
      # and would otherwise have to produce the second one again.
      - name: Coverage
        if: matrix.php == '8.5'
        run: |
          vendor/bin/pest --coverage --min=91 \
            --coverage-clover=build/coverage/clover.xml \
            --coverage-html=build/coverage/html \
            --log-junit build/coverage/junit.xml

      - name: Upload the coverage report
        if: matrix.php == '8.5'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: build/coverage
          retention-days: 7

  # Static analysis on SonarCloud.
  #
  # Its own job rather than a step in the test matrix, so that a finding and a
  # failing test are two different lines on a pull request instead of one red
  # cross. It needs the test job to have passed: analysing a commit whose suite
  # does not run would report on code nobody has checked.
  #
  # Not on a tag. SonarCloud analyses branches, and a tag ref is not one, so the
  # scan is accepted and then the gate check is refused with a 403 — a red run on
  # every release for a gate that already passed on the commit the tag points at.
  # The `Main` ruleset asks for this check on pull requests only, so nothing is
  # lost by leaving tags out.
  sonar:
    name: sonarcloud
    runs-on: ubuntu-latest
    needs: test
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
      && !startsWith(github.ref, 'refs/tags/')
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      # A missing token otherwise surfaces as an authentication failure several
      # steps later, which says nothing about what to do about it. This says it.
      - name: Is there a token?
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::error::SONAR_TOKEN is not set, so there is nothing to authenticate with."
          echo "::error::Create one at https://sonarcloud.io/account/security, then add it"
          echo "::error::under Settings -> Secrets and variables -> Actions."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # SonarCloud needs the full history to attribute new code, which a
          # shallow clone would not have.
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          # pcov rather than xdebug: the suite runs once more here, and xdebug is
          # roughly an order of magnitude slower.
          coverage: pcov
          tools: composer:v2

      - name: Install
        run: composer install --prefer-dist --no-interaction --no-progress

      # Both reports the analysis reads, produced in one run rather than the
      # second one being repeated. The HTML report is skipped; Sonar wants the
      # machine-readable one.
      - name: Coverage and test results for the analysis
        run: |
          vendor/bin/pest --coverage --min=91 \
            --coverage-clover=build/coverage/clover.xml \
            --log-junit build/coverage/junit.xml

      - name: Analyse
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8

      # Fails the pull request when the quality gate is red, which is the whole
      # point of running the analysis here rather than letting SonarCloud do it
      # on the side.
      - name: Quality gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1

      # What the server said, when the gate check could not read it.
      #
      # The action above dies on `curl: (22)` and says nothing else: it reads
      # the answer with `--silent --fail`, and the body — which is where the
      # reason is — is gone. This asks the same server the same question and
      # prints the answer, so the log says what is wrong rather than what the
      # symptom is.
      #
      # It only runs when the gate check has already failed, and it decides
      # nothing: the gate is still the action above. What it adds is the two
      # facts the answer is read against — the branch the analysis is of, and
      # the branch the project calls its main one. The gate of an analysis is
      # served for the main branch, so an analysis of any other branch is
      # refused by an organisation whose plan does not carry branch data, and
      # that refusal is a fact about the project rather than about this build.
      - name: What the server said
        if: failure()
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          task_id=$(sed -n 's/^ceTaskId=//p' .scannerwork/report-task.txt)
          project_key=$(sed -n 's/^projectKey=//p' .scannerwork/report-task.txt)
          task=$(curl -s --user "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/ce/task?id=${task_id}")
          analysis_id=$(jq -r '.task.analysisId' <<< "$task")
          analysed_branch=$(jq -r '.task.branch' <<< "$task")

          echo "== the gate of analysis ${analysis_id} =="
          code=$(curl -s --user "${SONAR_TOKEN}:" -o gate.json -w '%{http_code}' \
            "${SONAR_HOST_URL}/api/qualitygates/project_status?analysisId=${analysis_id}" || echo 000)
          cat gate.json
          echo
          echo "HTTP ${code}"

          echo
          echo "== the branches of ${project_key} =="
          branches=$(curl -s --user "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/project_branches/list?project=${project_key}")
          echo "$branches"
          main_branch=$(jq -r '.branches[] | select(.isMain) | .name' <<< "$branches")

          echo
          echo "::error::The analysis is of '${analysed_branch}'; the project's main branch is '${main_branch}'."

          # The advice below is right for the one answer that is about the branch.
          # A gate that says ERROR is a finding, and telling a reader to rename a
          # branch would send them away from it.
          if [ "${code}" = "403" ]; then
            echo "::error::The gate of a main branch analysis is served, and the gate of a pull request is;"
            echo "::error::the gate of any other branch is not, on a plan that does not carry branch data."
            echo "::error::Set the main branch of ${project_key} to '${DEFAULT_BRANCH}' — the repository's"
            echo "::error::default branch — in SonarQube Cloud: the project's Administration page, under Branches."
          fi

  # Everything above installs what the lock file pins, so a build is repeatable.
  # The cost of that is hearing nothing when a dependency publishes something
  # that breaks us, so this resolves afresh and runs the suite against the result.
  # It is the one place `composer update` belongs.
  dependencies:
    name: dependencies have moved
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Resolve the newest versions
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: What changed
        run: git --no-pager diff --stat composer.lock

      - name: The suite still passes
        run: vendor/bin/pest

      # A runtime dependency that stops supporting the version the library claims
      # is the failure worth catching, and the minimum job cannot see it while it
      # installs from the lock. Resolved against a simulated 8.2, so a resolution
      # that fails here says which package gave up which version.
      - name: The minimum version still resolves
        run: |
          php tools/resolve-runtime.php
          composer config --file=composer.runtime.json platform.php 8.2.99
          COMPOSER=composer.runtime.json composer update \
            --prefer-dist --no-interaction --no-progress --dry-run
