# Word style slots, by the names in `Styles::defaults()`.
#
# A value is either a style id — `Heading1`, without the space Word's UI puts in it —
# or a mapping of properties. A mapping is *merged* into the built-in look rather than
# replacing it, so naming the one property a theme is about leaves the rest alone;
# a style id and a `null` replace the slot whole.
#
# Colours are six hex digits with no `#`, sizes are points, and spacing is twips
# (a point is 20).

heading.1:
  styleName: Heading1
  bold: true
  size: 16
  color: "2F5496"
  space: { before: 240, after: 120 }
  keepNext: true

heading.2:
  styleName: Heading2
  bold: true
  size: 13
  color: "2F5496"
  space: { before: 200, after: 100 }
  keepNext: true

heading.3:
  styleName: Heading3
  bold: true
  size: 12
  color: "1F3763"
  space: { before: 160, after: 80 }
  keepNext: true

heading.4:
  styleName: Heading4
  bold: true
  italic: true
  size: 11
  color: "2F5496"
  space: { before: 140, after: 80 }
  keepNext: true

heading.5:
  styleName: Heading5
  bold: true
  size: 11
  color: "2F5496"
  space: { before: 120, after: 60 }
  keepNext: true

heading.6:
  styleName: Heading6
  italic: true
  size: 11
  color: "1F3763"
  space: { before: 120, after: 60 }
  keepNext: true

paragraph:
  space: { after: 120 }
  lineHeight: 1.15

blockQuote:
  styleName: IntenseQuote
  italic: true
  color: "404040"
  indentation: { left: 720, right: 720 }
  space: { before: 120, after: 120 }

codeBlock:
  indentation: { left: 360 }
  space: { before: 0, after: 0 }

listParagraph:
  space: { after: 60 }

codeFont:
  name: Consolas
  size: 9
  color: "A31515"

linkFont:
  color: "0563C1"
  underline: single